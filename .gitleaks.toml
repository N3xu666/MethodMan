# Gitleaks configuration for MethodMan
# Custom rules on top of the default ruleset.
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "MethodMan gitleaks config"

[extend]
# Use the built-in gitleaks ruleset as the base.
useDefault = true

[[rules]]
id = "htb-32hex-flag"
description = "Hack The Box 32-character hexadecimal flag"
# HTB flags are 32 lowercase hex chars. This is a broad pattern, so the
# allowlist below filters known-safe 32-hex strings (commit SHAs, favicon
# hashes, test fixtures, documentation examples).
regex = '''\b[a-f0-9]{32}\b'''
entropy = 3.0
keywords = []

[allowlist]
description = "Global allowlist: false positives for the 32-hex rule"
# Paths excluded from scanning.
paths = [
  '''tests/fixtures/''',
  '''_WORKFLOW\.md$''',
  '''PROMPT_NEXT_SESSION\.txt$''',
  '''masking-dict\.ps1$''',
]
# Regexes matching known-benign 32-hex strings.
regexes = [
  # Example / placeholder strings used in documentation.
  '''<USER_FLAG>''',
  '''<ROOT_FLAG>''',
  '''<SYSTEM_FLAG>''',
  # Hex strings that appear in tool READMEs as format examples.
  '''[a-f0-9]{32}.*example''',
  '''example.*[a-f0-9]{32}''',
]
# Rule-specific allowlist: учебные примеры curl -u в документации NETWORKS
[[rules.allowlists]]
description = "Educational curl -u examples in NETWORKS docs (not real credentials)"
targetRules = ["curl-auth-user"]
paths = [
  '''NETWORKS/03 Network Devices/02 Firewalls\.md''',
  '''NETWORKS/03 Network Devices/01 Router-and-Switch-Fundamentals\.md''',
]