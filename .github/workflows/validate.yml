name: Validate

on:
  push:
    paths-ignore:
      # Skip runs for binary assets no job reads. .md/.ps1/.py are NOT ignored:
      # CI exists to validate them (check.ps1, check-anchors, check-tables, pytest).
      - '**.png'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to avoid wasted CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Run check.ps1
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create placeholder masking-dict.ps1
        shell: pwsh
        run: |
          $placeholder = @('# CI placeholder - no real secrets', '$maskingDict = @{}')
          $p = Join-Path (Get-Location) 'masking-dict.ps1'
          $u = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllLines($p, $placeholder, $u)
          Write-Host 'Placeholder masking-dict.ps1 created.'

      - name: Run check.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\check.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  test:
    name: Run mask.ps1 tests
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\run-tests.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  tools-syntax:
    name: Validate tools/ Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile all tools/**/*.py
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(tools/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python tools found - nothing to compile."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Compiling: $f"
            python -m py_compile "$f"
          done
          echo "All Python tools compiled successfully."

  tools-tests:
    name: Run tools/python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/python/tests/requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          set -euo pipefail
          cd tools/python
          python -m pytest tests -v

      - name: Smoke test - pip install as package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./tools/python
          session-report --version
          session-report --help | head -5

  gitleaks:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    # BLOCKING since 2026-10-14 (promoted after several green sessions).

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
  audit:
    name: Run audit.ps1 (informational)
    runs-on: windows-latest
    # NON-BLOCKING. Deepest check layer (21 sections), informational only.
    # Local-state checks skipped via -SkipLocalChecks.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create placeholder masking-dict.ps1
        shell: pwsh
        run: |
          $placeholder = @('# CI placeholder - no real secrets', '$maskingDict = @{}')
          $p = Join-Path (Get-Location) 'masking-dict.ps1'
          $u = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllLines($p, $placeholder, $u)
          Write-Host 'Placeholder masking-dict.ps1 created.'

      - name: Run audit.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\audit.ps1 -SkipLocalChecks

  anchors:
    name: Run check-anchors.ps1 (informational)
    runs-on: windows-latest
    needs: check
    # NON-BLOCKING. Validates markdown anchor links (#section) in all tracked .md.
    # Catches stale anchors after folder/file renames.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run check-anchors.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\check-anchors.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
  tables:
    name: Run check-tables.ps1 (informational)
    runs-on: windows-latest
    needs: check
    # NON-BLOCKING. Validates markdown tables for inconsistent link usage.
    # Catches "added a row but forgot the link" bugs.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run check-tables.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\check-tables.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
