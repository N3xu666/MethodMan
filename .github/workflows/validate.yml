name: Validate

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Run check.ps1
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create placeholder masking-dict.ps1
        shell: pwsh
        run: |
          $placeholder = @('# CI placeholder - no real secrets', '$maskingDict = @{}')
          $p = Join-Path (Get-Location) 'masking-dict.ps1'
          $u = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllLines($p, $placeholder, $u)
          Write-Host 'Placeholder masking-dict.ps1 created.'

      - name: Run check.ps1
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\check.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  test:
    name: Run mask.ps1 tests
    runs-on: windows-latest
    needs: check

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\run-tests.ps1
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

  tools-syntax:
    name: Validate tools/ Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile all tools/**/*.py
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(tools/**/*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Python tools found - nothing to compile."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Compiling: $f"
            python -m py_compile "$f"
          done
          echo "All Python tools compiled successfully."

  tools-tests:
    name: Run tools/python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r tools/python/tests/requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          set -euo pipefail
          cd tools/python
          python -m pytest tests -v

      - name: Smoke test - pip install as package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ./tools/python
          session-report --version
          session-report --help | head -5

  gitleaks:
    name: Scan for secrets (gitleaks)
    runs-on: ubuntu-latest
    # NON-BLOCKING during ramp-up (pass 68a.1).
    # Promote to blocking after several green sessions.
    continue-on-error: true

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml