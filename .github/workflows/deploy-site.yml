name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'WRITEUPS/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './site/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # 🛡️ DEVSEOPS GATE: Блокируем деплой при High/Critical уязвимостях
      - name: Security Audit (DevSecOps Gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docusaurus
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9fed19aa4ed79946f009e8aad7437a922e62d523 # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=methodman
          workingDirectory: ./site
