name: Deploy Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'WRITEUPS/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: ./site

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@51396a62d62a1c5cf19980a4558135f0ea012885 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './site/package-lock.json'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # рџ›ЎпёЏ DEVSEOPS GATE: Р‘Р»РѕРєРёСЂСѓРµРј РґРµРїР»РѕР№ РїСЂРё High/Critical СѓСЏР·РІРёРјРѕСЃС‚СЏС…
      - name: Security Audit (DevSecOps Gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Build Docusaurus
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy build --project-name=methodman
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}